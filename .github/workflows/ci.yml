name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all --check

  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: Show the toolchain
        run: |
          rustup component add clippy
          rustc --version
          cargo --version

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build the docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      # Hosted runners are disposable and already elevated, so this is the only place real
      # snapshots are taken. The live tests snapshot these volumes, never C:.
      - name: Make the test volumes
        run: ./.github/scripts/make-test-volumes.ps1

      - name: Show the writers
        run: |
          vssadmin list writers
          exit 0

      - name: Test
        env:
          VSS_SNAPSHOT_TEST_VOLUMES: "V:,W:"
          VSS_SNAPSHOT_TEST_REFS_VOLUME: "R:"
        run: cargo test --all-features -- --nocapture

      # The tests check their own snapshots are removed, and this checks nothing else was left.
      # It reads the output, because vssadmin's exit code isn't a useful signal here.
      - name: Check no snapshots were left behind
        if: always()
        run: |
          $shadows = vssadmin list shadows | Out-String
          $shadows
          if ($shadows -match 'Shadow Copy ID') { exit 1 }
          exit 0

  msrv:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.82
        run: rustup toolchain install 1.82 --profile minimal

      # Picks dependency versions that still support the minimum Rust version.
      - name: Resolve dependencies for Rust 1.82
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: cargo generate-lockfile

      - name: Check
        run: cargo +1.82 check --all-targets --all-features
